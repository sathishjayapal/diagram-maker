services:
  diagram-maker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/diagram-maker:latest
    container_name: diagram-maker
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_PORT=8091
    volumes:
      - diagram-maker-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  diagram-maker-uploads:
